name: test-and-package

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - if: matrix.python-version == '3.13'
        run: python -m pip install build && python -m build
      - if: matrix.python-version == '3.13'
        run: python scripts/audit_release.py --wheel dist/*.whl
      - if: matrix.python-version == '3.13'
        run: python scripts/build_friend_kit.py --wheel dist/*.whl --output dist/research-agent-factory-kit-0.1.0.zip
      - if: matrix.python-version == '3.13'
        run: python scripts/audit_release.py --wheel dist/*.whl --bundle dist/research-agent-factory-kit-0.1.0.zip
      - if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: research-agent-factory-sdk
          path: dist/*
          if-no-files-found: error
