name: publish-kit

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Read package version
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "KIT_PATH=dist/research-agent-factory-kit-${VERSION}.zip" >> "$GITHUB_ENV"
      - run: python scripts/build_friend_kit.py --wheel dist/*.whl --output "$KIT_PATH"
      - run: python scripts/audit_release.py --wheel dist/*.whl --bundle "$KIT_PATH"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl "$KIT_PATH" --generate-notes
