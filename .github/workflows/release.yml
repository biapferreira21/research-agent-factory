name: publish-kit

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/build_friend_kit.py --wheel dist/*.whl --output dist/research-agent-factory-kit-0.1.0.zip
      - run: python scripts/audit_release.py --wheel dist/*.whl --bundle dist/research-agent-factory-kit-0.1.0.zip
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/research-agent-factory-kit-0.1.0.zip --generate-notes
